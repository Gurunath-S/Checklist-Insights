<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Sparkle Gold Gradient -->
    <linearGradient id="sparkle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Glow Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Shape -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)"/>
  
  <!-- Subtle Outer Ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#accent-grad)" stroke-width="8" stroke-opacity="0.4"/>

  <!-- Checklist Card Graphic -->
  <g filter="url(#glow)">
    <!-- Main Card Body -->
    <rect x="112" y="112" width="288" height="288" rx="40" fill="#1E293B" stroke="url(#accent-grad)" stroke-width="12" filter="url(#card-shadow)"/>

    <!-- Checklist Item 1 (Checked) -->
    <circle cx="176" cy="184" r="20" fill="url(#accent-grad)"/>
    <path d="M166 184 L173 191 L187 177" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="216" y="174" width="136" height="20" rx="10" fill="#E2E8F0"/>

    <!-- Checklist Item 2 (Checked) -->
    <circle cx="176" cy="256" r="20" fill="url(#accent-grad)"/>
    <path d="M166 256 L173 263 L187 249" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="216" y="246" width="104" height="20" rx="10" fill="#CBD5E1"/>

    <!-- Checklist Item 3 (Progress Bar / Analytics Accent) -->
    <circle cx="176" cy="328" r="20" fill="#334155" stroke="url(#accent-grad)" stroke-width="4"/>
    <rect x="216" y="318" width="120" height="20" rx="10" fill="#64748B"/>
  </g>

  <!-- AI Genie Sparkle Icon Overlay -->
  <g transform="translate(320, 80) scale(1.4)" filter="url(#glow)">
    <!-- Large Central Sparkle -->
    <path d="M 40 0 C 40 22.09 57.91 40 80 40 C 57.91 40 40 57.91 40 80 C 40 57.91 22.09 40 0 40 C 22.09 40 40 22.09 40 0 Z" fill="url(#sparkle-grad)"/>
  </g>

  <!-- Small Secondary Sparkle -->
  <g transform="translate(90, 350) scale(0.7)" opacity="0.9">
    <path d="M 40 0 C 40 22.09 57.91 40 80 40 C 57.91 40 40 57.91 40 80 C 40 57.91 22.09 40 0 40 C 22.09 40 40 22.09 40 0 Z" fill="url(#sparkle-grad)"/>
  </g>
</svg>